<h2 mat-dialog-title>Weitere Nachfrage</h2>

<mat-dialog-content>
  <p><strong>KI‑Frage:</strong></p>
  <p>{{ data.inquiry }}</p>

  <mat-form-field appearance="outline" class="w-full">
    <mat-label>Antwort des Users</mat-label>
    <textarea
      matInput
      rows="5"
      [(ngModel)]="userAnswer"
      placeholder="Antwort eingeben"
    ></textarea>
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button type="button" (click)="onCancel()">Abbrechen</button>
  <button
    mat-flat-button
    color="primary"
    type="button"
    (click)="onSubmit()"
    [disabled]="!userAnswer.trim()"
  >
    Absenden
  </button>
</mat-dialog-actions>
